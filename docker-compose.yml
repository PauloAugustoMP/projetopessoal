services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
      POSTGRES_DB: investor
    ports:
      - "5432:5432"
    volumes:
      # Bind mount: the database lives in ./data/postgres, visible on the host —
      # easy to back up (docs/sprints.md Sprint 7) and to inspect. Never commit it:
      # data/ is in .gitignore.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
