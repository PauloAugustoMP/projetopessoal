[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.11",
    "argon2-cffi>=23.1",
    "brapi>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
