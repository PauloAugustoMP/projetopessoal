openapi: 3.0.3
info:
  title: Investment Tracker API
  description: >
    API for the personal investment tracking app (single-user, product reference: Investidor10).
    Full business rules in docs/business-rules.md. Near-real-time quote updates are delivered
    through a separate WebSocket channel (`/ws/quotes`), outside the scope of this REST spec.
  version: "1.0.0"
servers:
  - url: http://localhost:8000/api
    description: Local (Docker Compose)
  - url: https://portfolio.tailnet.ts.net/api
    description: Remote access via Tailscale

tags:
  - name: auth
  - name: assets
  - name: transactions
  - name: positions
  - name: portfolio
  - name: dividends
  - name: allocation
  - name: corporate-actions
  - name: import

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh the access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /assets:
    get:
      tags: [assets]
      summary: Search assets (ticker autocomplete)
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Filter by ticker or name
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  /assets/{ticker}:
    get:
      tags: [assets]
      summary: Asset detail
      parameters:
        - $ref: "#/components/parameters/TickerParam"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{ticker}/indicators:
    get:
      tags: [assets]
      summary: Fundamental indicators, markers, and target prices
      description: Computes P/E, P/B, DY, ROE (with marker color) and ceiling price (Bazin) / fair price (Graham).
      parameters:
        - $ref: "#/components/parameters/TickerParam"
      responses:
        "200":
          description: Asset indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIndicators"

  /assets/{ticker}/price-history:
    get:
      tags: [assets]
      summary: Historical price series
      parameters:
        - $ref: "#/components/parameters/TickerParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Historical series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricePoint"

  /transactions:
    get:
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: ticker
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      tags: [transactions]
      summary: Record a transaction (buy or sell)
      description: >
        Entries dated in the past trigger the recalculation engine (docs/business-rules.md §2)
        asynchronously. The response includes `recalculating: true` while processing runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Sell larger than the position available on that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [transactions]
      summary: Transaction detail
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [transactions]
      summary: Edit a transaction (triggers recalculation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      tags: [transactions]
      summary: Remove a transaction (triggers recalculation)
      responses:
        "204":
          description: Removed

  /positions:
    get:
      tags: [positions]
      summary: Current portfolio positions
      responses:
        "200":
          description: List of positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolio/summary:
    get:
      tags: [portfolio]
      summary: Portfolio summary (used on the dashboard)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/snapshots:
    get:
      tags: [portfolio]
      summary: Historical portfolio value series (growth chart)
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Daily snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioSnapshot"

  /portfolio/growth-breakdown:
    get:
      tags: [portfolio]
      summary: Growth breakdown (contributions vs. appreciation vs. reinvested dividends)
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Breakdown for the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthBreakdown"

  /dividends:
    get:
      tags: [dividends]
      summary: Dividends (history and schedule) — feeds the calendar
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [announced, paid, pending_review]
      responses:
        "200":
          description: List of dividends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dividend"
    post:
      tags: [dividends]
      summary: Manually register an announced dividend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DividendInput"
      responses:
        "201":
          description: Dividend created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dividend"

  /dividends/reinvestment-balance:
    get:
      tags: [dividends]
      summary: Dividend balance available for reinvestment
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableBalance: { type: number, format: double }

  /dividends/reinvest:
    post:
      tags: [dividends]
      summary: Reinvest the dividend balance
      description: Uses the available balance as the contribution amount in the rebalancing simulator (docs/business-rules.md §3 and §9).
      responses:
        "200":
          description: Suggested purchases generated from the dividend balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceSuggestion"

  /allocation-targets:
    get:
      tags: [allocation]
      summary: Current allocation targets (by category and by asset)
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationTargets"
    put:
      tags: [allocation]
      summary: Set allocation targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationTargets"
      responses:
        "200":
          description: Targets updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationTargets"
        "400":
          description: Category percentages don't add up to 100%
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /allocation-targets/simulate:
    post:
      tags: [allocation]
      summary: Simulate a contribution according to the allocation targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contributionAmount]
              properties:
                contributionAmount:
                  type: number
                  format: double
                  example: 5000
      responses:
        "200":
          description: Suggested purchases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceSuggestion"

  /corporate-actions:
    get:
      tags: [corporate-actions]
      summary: Applied corporate actions (split, reverse split, bonus shares, subscription rights)
      description: Read-only — populated automatically by the B3 statement import.
      parameters:
        - name: ticker
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorporateAction"

  /import/b3-statement:
    post:
      tags: [import]
      summary: Import a B3 statement of transactions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid file or unrecognized format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TickerParam:
      name: ticker
      in: path
      required: true
      schema: { type: string }
      example: ITSA4
    FromParam:
      name: from
      in: query
      schema: { type: string, format: date }
    ToParam:
      name: to
      in: query
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: SELL_EXCEEDS_POSITION }
        message: { type: string }

    AssetCategory:
      type: string
      enum: [stock, reit, fixed_income, crypto]

    Asset:
      type: object
      properties:
        ticker: { type: string, example: ITSA4 }
        name: { type: string, example: Itaúsa }
        category:
          $ref: "#/components/schemas/AssetCategory"
        logoUrl:
          type: string
          nullable: true
          description: Comes from the quote provider when available; otherwise the UI falls back to an initials avatar colored by category.

    PricePoint:
      type: object
      properties:
        date: { type: string, format: date }
        price: { type: number, format: double }

    IndicatorMarker:
      type: string
      enum: [green, yellow, red]

    Indicator:
      type: object
      properties:
        name: { type: string, example: P/B }
        value: { type: number, format: double }
        marker:
          $ref: "#/components/schemas/IndicatorMarker"
        description:
          type: string
          description: Text shown in the explanatory tooltip.

    AssetIndicators:
      type: object
      properties:
        ticker: { type: string }
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
        bazinCeilingPrice:
          type: number
          format: double
          nullable: true
        grahamFairPrice:
          type: number
          format: double
          nullable: true

    TransactionType:
      type: string
      enum: [buy, sell]

    TransactionInput:
      type: object
      required: [ticker, type, quantity, pricePerShare, date]
      properties:
        ticker: { type: string, example: ITSA4 }
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity: { type: number, example: 100 }
        pricePerShare: { type: number, format: double, example: 9.10 }
        date: { type: string, format: date }
        fees:
          type: number
          format: double
          nullable: true
          description: Optional — brokerage/exchange fees, used only for cost precision, not required.

    Transaction:
      allOf:
        - $ref: "#/components/schemas/TransactionInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            source:
              type: string
              enum: [manual, b3_import]
            recalculating:
              type: boolean
              description: true while the recalculation engine is still processing this change.

    Position:
      type: object
      properties:
        ticker: { type: string }
        category:
          $ref: "#/components/schemas/AssetCategory"
        quantity: { type: number }
        averagePrice: { type: number, format: double }
        currentPrice: { type: number, format: double }
        profitPercentage: { type: number, format: double }
        portfolioPercentage: { type: number, format: double }

    PortfolioSummary:
      type: object
      properties:
        totalValue: { type: number, format: double }
        todayChangePercentage: { type: number, format: double }
        monthProfitPercentage: { type: number, format: double }
        monthDividends: { type: number, format: double }
        averageDy: { type: number, format: double }
        assetCount: { type: integer }

    PortfolioSnapshot:
      type: object
      properties:
        date: { type: string, format: date }
        totalValue: { type: number, format: double }
        valueByCategory:
          type: object
          additionalProperties: { type: number, format: double }
        cumulativeContributions: { type: number, format: double }
        cumulativeReinvestedDividends: { type: number, format: double }

    GrowthBreakdown:
      type: object
      description: contributions + appreciation + reinvestedDividends must add up to totalChange (computed by residual, docs/business-rules.md §8).
      properties:
        totalChange: { type: number, format: double }
        contributions: { type: number, format: double }
        appreciation: { type: number, format: double }
        reinvestedDividends: { type: number, format: double }

    DividendType:
      type: string
      enum: [dividend, jcp, reit_income, fixed_income_redemption]

    DividendInput:
      type: object
      required: [ticker, type, grossValuePerShare, exDate, paymentDate]
      properties:
        ticker: { type: string }
        type:
          $ref: "#/components/schemas/DividendType"
        grossValuePerShare: { type: number, format: double }
        exDate: { type: string, format: date }
        paymentDate: { type: string, format: date }

    Dividend:
      allOf:
        - $ref: "#/components/schemas/DividendInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            withholdingTaxRate: { type: number, format: double }
            netValuePerShare: { type: number, format: double }
            status:
              type: string
              enum: [announced, paid, pending_review]
            reinvested: { type: boolean }

    RebalanceItem:
      type: object
      properties:
        ticker: { type: string }
        currentPercentage: { type: number, format: double }
        targetPercentage: { type: number, format: double }
        suggestedValue: { type: number, format: double }
        suggestedQuantity: { type: integer }

    RebalanceSuggestion:
      type: object
      properties:
        contributionAmount: { type: number, format: double }
        items:
          type: array
          items:
            $ref: "#/components/schemas/RebalanceItem"
        unallocatedValue:
          type: number
          format: double
          description: Rounding leftover not allocated in this contribution.

    TargetAsset:
      type: object
      properties:
        ticker: { type: string }
        weightInCategory:
          type: number
          format: double
          nullable: true
          description: Null = split equally among the assets in the same category.

    AllocationTarget:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/AssetCategory"
        percentage: { type: number, format: double }
        assets:
          type: array
          items:
            $ref: "#/components/schemas/TargetAsset"

    AllocationTargets:
      type: object
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/AllocationTarget"

    CorporateActionType:
      type: string
      enum: [split, reverse_split, bonus_shares, subscription_rights]

    CorporateAction:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        type:
          $ref: "#/components/schemas/CorporateActionType"
        date: { type: string, format: date }
        factor: { type: number, format: double }
        source:
          type: string
          enum: [b3_import]

    ImportResult:
      type: object
      properties:
        transactionsCreated: { type: integer }
        dividendsCreated: { type: integer }
        corporateActionsCreated: { type: integer }
        duplicatesSkipped: { type: integer }
        rowsForManualReview:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              reason: { type: string }
